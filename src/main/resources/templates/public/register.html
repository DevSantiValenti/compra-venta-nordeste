<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | Compra y Venta NEA</title>
  <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
  <link rel="apple-touch-icon" th:href="@{/img/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: topbar}"></div>
<main class="app-shell">
  <section class="page-narrow form-panel">
    <div class="auth-title">
      <h1>Crear Cuenta</h1>
      <p>Es gratis y rapido</p>
    </div>
    <p class="error" th:if="${registerError}" th:text="${registerError}">Error</p>

    <a class="btn google-btn" th:if="${googleOAuthEnabled}" th:href="@{/oauth2/authorization/google}">
      <span class="google-mark">G</span> Registrarse con Google
    </a>
    <div class="divider">O usa tu email</div>

    <form th:action="@{/register}" method="post" th:object="${registerForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="form-grid two">
        <div class="field"><label>Nombre</label><input th:field="*{firstName}" required></div>
        <div class="field"><label>Apellido</label><input th:field="*{lastName}" required></div>
      </div>
      <div class="field"><label>Email (recuerdalo, lo usarás para iniciar sesión)</label><input th:field="*{email}" type="email" required></div>
      <div class="field"><label>Contraseña</label><input th:field="*{password}" type="password" required></div>
      <div class="field"><label>Telefono (WhatsApp)</label><input th:field="*{phone}" required></div>
      <div class="form-grid two">
        <div class="field"><label>Ciudad</label><input th:field="*{city}" required></div>
        <div class="field"><label>Provincia</label><input th:field="*{province}" required></div>
      </div>
      <button class="btn full" type="submit">Crear Cuenta</button>
    </form>
    <p class="auth-footer">¿Ya tenes cuenta? <a th:href="@{/login}">Ingresar</a></p>
  </section>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
