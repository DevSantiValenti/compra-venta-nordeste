<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${formTitle}">Categoría</title>
  <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
  <link rel="apple-touch-icon" th:href="@{/img/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: adminTopbar}"></div>
<main class="app-shell">
  <section class="page-narrow">
    <form class="form-panel publish-form" th:action="@{${formAction}}" th:object="${categoryForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <h1 th:text="${formTitle}">Categoría</h1>

      <div class="field">
        <label for="name">Nombre</label>
        <input id="name" th:field="*{name}" placeholder="Ej. Bicicletas MTB" required>
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p>
      </div>

      <div class="field">
        <label for="slug">Slug</label>
        <input id="slug" th:field="*{slug}" placeholder="Se genera automáticamente si lo dejás vacío">
      </div>

      <div class="form-grid two">
        <div class="field">
          <label for="icon">Icono</label>
          <input id="icon" th:field="*{icon}" placeholder="Ej. bike, casco, rueda">
        </div>
        <div class="field">
          <label for="displayOrder">Orden</label>
          <input id="displayOrder" th:field="*{displayOrder}" type="number" step="1" placeholder="0">
        </div>
      </div>

      <label class="toggle-field">
        <input type="checkbox" th:field="*{active}">
        <span>Activa y visible en publicar/filtros</span>
      </label>

      <div class="form-actions">
        <a class="btn secondary" th:href="@{/admin/categories}">Cancelar</a>
        <button class="btn" type="submit">Guardar categoría</button>
      </div>
    </form>
  </section>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
</body>
</html>
