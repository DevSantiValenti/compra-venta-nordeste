<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Publicacion</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments/header :: adminTopbar}"></div>
<main class="app-shell">
  <article class="detail-panel">
    <h1 th:text="${product.title}">Producto</h1>
    <p class="price" th:text="${'$ ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">$ 0</p>
    <p th:text="${product.description}">Descripcion</p>
    <p class="meta" th:text="${product.status + ' · ' + product.seller.email + ' · vistas: ' + product.viewsCount + ' · WhatsApp: ' + product.whatsappClicksCount}">Datos</p>
    <div class="row-actions admin-detail-actions">
      <a class="btn secondary" th:href="@{/producto/{slug}(slug=${product.slug})}">Ver publicacion</a>
      <form th:action="@{/admin/products/{id}/hide(id=${product.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn secondary" type="submit">Ocultar</button>
      </form>
      <form th:action="@{/admin/products/{id}/reactivate(id=${product.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn" type="submit">Reactivar</button>
      </form>
      <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn danger" type="submit">Eliminar</button>
      </form>
    </div>
  </article>
</main>
</body>
</html>
