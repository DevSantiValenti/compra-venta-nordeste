<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuario</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments/header :: adminTopbar}"></div>
<main class="app-shell">
  <section class="detail-panel">
    <h1 th:text="${user.fullName}">Usuario</h1>
    <p class="meta" th:text="${user.email}">Email</p>
    <p class="meta" th:text="${user.phone + ' · ' + user.city + ', ' + user.province}">Datos</p>
    <p class="meta" th:text="${'Rol: ' + user.role + ' · verificado: ' + user.verified + ' · bloqueado: ' + user.blocked}">Estado</p>
    <div class="row-actions">
      <form th:action="@{/admin/users/{id}/block(id=${user.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger" type="submit">Bloquear</button></form>
      <form th:action="@{/admin/users/{id}/unblock(id=${user.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn secondary" type="submit">Desbloquear</button></form>
      <form th:action="@{/admin/users/{id}/verify(id=${user.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn" type="submit">Verificar</button></form>
    </div>
  </section>
</main>
</body>
</html>
