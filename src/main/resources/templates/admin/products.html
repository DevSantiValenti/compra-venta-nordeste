<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Publicaciones</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments/header :: adminTopbar}"></div>
<main class="app-shell">
  <section class="hero"><h1>Publicaciones</h1></section>
  <section class="table-list">
    <article class="row-card" th:each="product : ${products.content}">
      <strong th:text="${product.title}">Producto</strong>
      <p class="meta" th:text="${product.status + ' · ' + product.seller.email + ' · reportes: ' + product.reportCount}">Estado</p>
      <div class="row-actions">
        <a class="btn secondary" th:href="@{/admin/products/{id}(id=${product.id})}">Detalle</a>
        <form th:action="@{/admin/products/{id}/hide(id=${product.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn secondary" type="submit">Ocultar</button></form>
        <form th:action="@{/admin/products/{id}/reactivate(id=${product.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn" type="submit">Reactivar</button></form>
        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger" type="submit">Eliminar</button></form>
      </div>
    </article>
  </section>
</main>
</body>
</html>
