<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Avisos | Compra y Venta NEA</title>
  <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
  <link rel="apple-touch-icon" th:href="@{/img/favicon.png}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<div th:replace="~{fragments/header :: topbar}"></div>
<main class="app-shell">
  <div class="page-wide">
    <div class="section-row hero">
      <div>
        <h1>Mis Avisos</h1>
        <p>Administra tus publicaciones activas, vendidas o pausadas.</p>
      </div>
      <a class="btn pill small" th:href="@{/products/new}">Nueva Publicación</a>
    </div>

    <section class="table-list">
      <article class="row-card" th:each="product : ${products.content}">
        <img th:if="${product.mainImage != null}" th:src="${product.mainImage.filePath}" th:alt="${product.title}">
        <div th:if="${product.mainImage == null}" class="row-thumb"></div>
        <div>
          <strong th:text="${product.title}">Producto</strong>
          <p class="price" th:text="${product.currency != null && product.currency.name() == 'USD' ? 'U$D ' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA') : '$' + #numbers.formatDecimal(product.price, 0, 'POINT', 0, 'COMMA')}">$0</p>
          <p class="meta" th:text="${'⊙ ' + product.viewsCount + '   ☏ ' + product.whatsappClicksCount}">Metricas</p>
        </div>
        <div class="row-actions">
          <span th:class="'status-pill status-' + ${#strings.toLowerCase(product.status.name())}"
                th:text="${product.status.name() == 'ACTIVE' ? 'Activa' : (product.status.name() == 'HIDDEN' ? 'Pausada' : (product.status.name() == 'SOLD' ? 'Vendido' : (product.status.name() == 'EXPIRED' ? 'Vencida' : 'Eliminada')))}">Activa</span>
          <a class="action-button view" data-icon="◉" aria-label="Ver publicación" th:href="@{/producto/{slug}(slug=${product.slug})}"><span>Ver</span></a>
          <a class="action-button edit" data-icon="✎" aria-label="Editar publicación" th:href="@{/products/edit/{id}(id=${product.id})}"><span>Editar</span></a>
          <form th:action="@{/products/{id}/sold(id=${product.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="returnTo" value="/products/my">
            <button type="submit"
                    th:class="${product.status.name() == 'SOLD' ? 'action-button activate js-confirm-action' : 'action-button sold js-confirm-action'}"
                    th:attr="data-icon=${product.status.name() == 'SOLD' ? '✓' : '$'},
                             aria-label=${product.status.name() == 'SOLD' ? 'Quitar vendido' : 'Marcar como vendido'},
                             data-confirm-icon=${product.status.name() == 'SOLD' ? '✓' : '$'},
                             data-confirm-title=${product.status.name() == 'SOLD' ? 'Quitar vendido' : 'Marcar como vendido'},
                             data-confirm-body=${product.status.name() == 'SOLD' ? 'La publicación volverá a estar activa.' : '¿Querés marcar esta publicación como vendida?'},
                             data-confirm-label=${product.status.name() == 'SOLD' ? 'Activar' : 'Marcar vendido'}">
              <span th:text="${product.status.name() == 'SOLD' ? 'Activar' : 'Vendido'}">Vendido</span>
            </button>
          </form>
          <form th:action="@{/products/{id}/toggle-active(id=${product.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="returnTo" value="/products/my">
            <button type="submit"
                    th:class="${product.status.name() == 'ACTIVE' ? 'action-button pause js-confirm-action' : 'action-button activate js-confirm-action'}"
                    th:attr="data-icon=${product.status.name() == 'ACTIVE' ? 'Ⅱ' : '✓'},
                             aria-label=${product.status.name() == 'ACTIVE' ? 'Pausar publicación' : 'Activar publicación'},
                             data-confirm-title=${product.status.name() == 'ACTIVE' ? 'Pausar publicación' : 'Activar publicación'},
                             data-confirm-body=${product.status.name() == 'ACTIVE' ? 'La publicación dejará de aparecer en el marketplace.' : 'La publicación volverá a aparecer en el marketplace.'},
                             data-confirm-label=${product.status.name() == 'ACTIVE' ? 'Pausar' : 'Activar'},
                             data-confirm-icon=${product.status.name() == 'ACTIVE' ? 'Ⅱ' : '✓'}">
              <span th:text="${product.status.name() == 'ACTIVE' ? 'Pausar' : 'Activar'}">Pausar</span>
            </button>
          </form>
          <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="returnTo" value="/products/my">
            <button type="submit" class="action-button delete js-confirm-action" data-icon="×" aria-label="Eliminar publicación"
                    data-confirm-icon="×"
                    data-confirm-title="Eliminar publicación"
                    th:attr="data-confirm-body=${'¿Seguro que querés eliminar &quot;' + product.title + '&quot;? Esta acción la saca definitivamente del listado.'}"
                    data-confirm-label="Eliminar"
                    data-confirm-danger="true"><span>Eliminar</span></button>
          </form>
        </div>
      </article>
      <div class="empty-card" th:if="${products.content.isEmpty()}">Todavia no tenes publicaciones.</div>
    </section>
  </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<div th:replace="~{fragments/nav :: bottomNav}"></div>
<div th:replace="~{fragments/confirm-modal :: confirmModal}"></div>
</body>
</html>
