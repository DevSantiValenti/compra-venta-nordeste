<header class="topbar" th:fragment="topbar" xmlns:th="http://www.thymeleaf.org">
  <div class="topbar-inner">
    <a class="mobile-back"
       th:classappend="${currentPath == '/' ? ' is-hidden' : ''}"
       th:href="@{/}"
       onclick="if (window.history.length > 1) { window.history.back(); return false; }"
       aria-label="Volver">
      <span class="sr-only">Volver</span>
    </a>
    <a class="brand" th:href="@{/}">COMPRA Y VENTA<span>NEA</span></a>
    <nav class="top-actions">
      <a th:classappend="${currentPath == '/' || #strings.startsWith(currentPath, '/categoria') || #strings.startsWith(currentPath, '/producto')} ? ' active' : ''" th:href="@{/}">Inicio</a>
      <a th:if="${currentUser != null && currentUser.role.name() == 'ADMIN'}" class="admin-top-link" th:classappend="${#strings.startsWith(currentPath, '/admin')} ? ' active' : ''" th:href="@{/admin/dashboard}">Admin</a>
      <a th:if="${currentUser == null}" th:classappend="${#strings.startsWith(currentPath, '/login')} ? ' active' : ''" th:href="@{/login}">Ingresar</a>
      <a th:if="${currentUser == null}" class="btn pill" th:classappend="${#strings.startsWith(currentPath, '/register')} ? ' active' : ''" th:href="@{/register}">Registrate</a>
      <a th:if="${currentUser != null}" th:classappend="${#strings.startsWith(currentPath, '/products/new')} ? ' active' : ''" th:href="@{/products/new}">Publicar</a>
      <a th:if="${currentUser != null}" th:classappend="${#strings.startsWith(currentPath, '/products/my') || #strings.startsWith(currentPath, '/products/edit')} ? ' active' : ''" th:href="@{/products/my}">Mis Avisos</a>
      <a th:if="${currentUser != null}" th:classappend="${#strings.startsWith(currentPath, '/user')} ? ' active' : ''" th:href="@{/user/dashboard}">Perfil</a>
      <form th:if="${currentUser != null}" th:action="@{/logout}" method="post" class="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="link-button" type="submit">Salir</button>
      </form>
    </nav>
  </div>
  <section class="admin-access" th:if="${currentUser != null && currentUser.role.name() == 'ADMIN'}">
    <div class="admin-access-inner">
      <strong>Admin</strong>
      <a th:classappend="${#strings.startsWith(currentPath, '/admin/dashboard')} ? ' active' : ''" th:href="@{/admin/dashboard}">Dashboard</a>
      <a th:classappend="${#strings.startsWith(currentPath, '/admin/users')} ? ' active' : ''" th:href="@{/admin/users}">Usuarios</a>
      <a th:classappend="${#strings.startsWith(currentPath, '/admin/products')} ? ' active' : ''" th:href="@{/admin/products}">Publicaciones</a>
      <a th:classappend="${#strings.startsWith(currentPath, '/admin/reports')} ? ' active' : ''" th:href="@{/admin/reports}">Reportes</a>
    </div>
  </section>
</header>

      <a th:classappend="${#strings.startsWith(currentPath, '/admin/reports')} ? ' active' : ''" th:href="@{/admin/reports}">Reportes</a>
      <a th:classappend="${#strings.startsWith(currentPath, '/user')} ? ' active' : ''" th:href="@{/user/dashboard}">Perfil</a>
    </div>
  </section>
</header>
