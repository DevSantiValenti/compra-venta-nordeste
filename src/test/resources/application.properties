spring.application.name=compraventanea-test
spring.datasource.url=jdbc:h2:mem:compraventanea;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.sql.init.mode=never
app.site-name=Ciclismo NEA
app.upload.products-dir=${java.io.tmpdir}/compraventanea-test-products
app.upload.max-file-size=5MB
app.upload.image-max-width=1400
app.upload.thumbnail-width=420
